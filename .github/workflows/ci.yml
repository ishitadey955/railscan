# Runs on every push and pull request: lint, the test suite, and a secret scan of the history.
# A red check on GitHub means: do not deploy (Streamlit redeploys main on every push).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install (app requirements + test tools; no TensorFlow, it is only for retraining)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pgserver==0.1.4 pyflakes
      - name: Lint
        run: python -m pyflakes app.py src scripts tests
      - name: Tests (the full railway database is not built here; tests that need it are skipped)
        run: python -m pytest tests -q

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
